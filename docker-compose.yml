# ==========================================================================
# MultiMateriales Los Alpes — Contenedores
#
#   app      Node.js + Express (API + página web)   http://localhost:8080
#   db       PostgreSQL 16 (datos en un volumen)    solo red interna
#   adminer  Visor web de la base de datos          http://localhost:8081
#
# Los tres se comunican por la red interna "backend". El contenedor "app"
# encuentra a la base de datos por su nombre de servicio: "db".
#
# Uso:  1) cp .env.example .env   (y cambia la contraseña)
#       2) docker compose up -d --build     (ver README.md)
# ==========================================================================
name: multimateriales

services:
  db:
    image: postgres:16.6-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
      POSTGRES_USER: ${POSTGRES_USER:-inventario}
      # Obligatoria: se lee del archivo .env (que NO se sube al repositorio).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copia .env.example a .env y define la clave}
      TZ: America/Bogota
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    # Sin "ports": PostgreSQL NO queda expuesto fuera de Docker.

  app:
    build:
      context: .
      target: runtime
    image: multimateriales-app:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Comunicación entre contenedores: se usa el NOMBRE DEL SERVICIO "db"
      # (DNS interno de la red de Docker), no localhost ni una IP fija.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-inventario}
      DB_USER: ${POSTGRES_USER:-inventario}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Copia .env.example a .env y define la clave}
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMINER_URL: http://localhost:${ADMINER_PORT:-8081}/?pgsql=db&username=${POSTGRES_USER:-inventario}&db=${POSTGRES_DB:-inventario}
      TZ: America/Bogota
    ports:
      - "${APP_PORT:-8080}:3000"
    networks:
      - backend

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
