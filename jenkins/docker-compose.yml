# ==========================================================================
# Jenkins local (segunda entrega). Uso, desde la carpeta jenkins/:
#   docker compose up -d --build
#   Abrir http://localhost:8090
#   Contraseña inicial: docker compose exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
# Ver docs/JENKINS.md
# ==========================================================================
name: jenkins

services:
  jenkins:
    build: .
    image: multimateriales-jenkins:lts
    restart: unless-stopped
    # root para poder usar el socket de Docker Desktop (solo entorno local/académico).
    user: root
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: America/Bogota
      JAVA_OPTS: -Duser.timezone=America/Bogota

volumes:
  jenkins_home:
