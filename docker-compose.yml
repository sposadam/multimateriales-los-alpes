# ==========================================================================
# MultiMateriales Los Alpes — Contenedores
#
#   app      Node.js + Express (API + página web)   http://localhost:8080
#   db       PostgreSQL 16.6 (datos en un volumen)  solo red interna
#   adminer  Visor web de la base de datos          http://127.0.0.1:8081
#
# Los servicios se comunican por la red propia "backend". El contenedor "app"
# encuentra a la base de datos por su NOMBRE DE SERVICIO: "db".
#
# Seguridad: este archivo NO contiene contraseñas. Las credenciales de la
# base de datos se cargan desde el archivo .env (env_file), que está en
# .gitignore. En el repositorio solo se publica la plantilla .env.example.
#
# Uso:  1) cp .env.example .env   (y define tu contraseña)
#       2) docker compose up -d --build     (ver README.md)
# ==========================================================================
name: multimateriales

services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: multimateriales-db:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    # Nombre de la base, usuario y clave se leen del archivo .env
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend
    # Sin "ports": PostgreSQL NO queda expuesto fuera de Docker.

  app:
    build:
      context: .
      target: runtime
    image: multimateriales-app:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Credenciales de la base de datos desde el archivo .env
    env_file:
      - .env
    environment:
      # Comunicación entre contenedores: se usa el NOMBRE DEL SERVICIO "db"
      # (DNS interno de la red de Docker), no localhost ni una IP fija.
      DB_HOST: localhost
      DB_PORT: "5432"
      ADMINER_URL: http://localhost:${ADMINER_PORT:-8081}/?pgsql=db
      TZ: America/Bogota
    ports:
      - "${APP_PORT:-8080}:3000"
    networks:
      - backend

  adminer:
    image: adminer:4.8.1@sha256:34d37131366c5aa84e1693dbed48593ed6f95fb450b576c1a7a59d3a9c9e8802
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
